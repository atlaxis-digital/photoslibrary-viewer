<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Photos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8eaef'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23f2a93b'/%3E%3Cpath d='M4 26l8-9 5 5 4-4 7 8z' fill='%233d6fd9'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-bg"/><circle cx="12" cy="12" r="4" fill="#f2a93b"/><path d="M4 26l8-9 5 5 4-4 7 8z" fill="#3d6fd9"/></svg>
      <span id="libTitle">Photos</span>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="footInfo"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="heading">
        <h1 id="viewTitle"></h1>
        <span class="count" id="viewCount"></span>
      </div>
      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="searchInput" type="search" autocomplete="off">
      </form>
      <label class="zoom" title="">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <input id="zoom" type="range" min="80" max="320" step="10" value="160">
      </label>
      <button class="icon-btn" id="showBtn" aria-label="Slideshow" title="Slideshow (S)" hidden><svg viewBox="0 0 24 24"><path class="ss-play" d="M7 5l12 7-12 7z"/><path class="ss-pause" d="M8 5v14M16 5v14"/></svg></button>
      <button class="icon-btn fs-btn" id="fullBtn" aria-label="Fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path class="fs-enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fs-exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
    </header>
    <div class="scroller" id="scroller">
      <div class="view-head" id="viewHead" hidden></div>
      <div class="canvas" id="canvas"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <div class="date-pill" id="datePill" hidden></div>
    <nav class="scrubber" id="scrubber" aria-label="Years"></nav>
  </main>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="">
    <video id="lbVideo" controls playsinline preload="metadata" hidden></video>
    <video id="lbLive" muted playsinline hidden></video>
    <div class="lb-msg" id="lbMsg" hidden></div>
    <div class="lb-spinner" id="lbSpinner" hidden></div>
    <div class="lb-zoom" id="lbZoom" hidden></div>
  </div>
  <div class="lb-bar">
    <button class="icon-btn" id="lbClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="lb-caption"><strong id="lbDate"></strong><span id="lbSub"></span></div>
    <button class="chip-btn" id="lbLiveBtn" hidden>LIVE</button>
    <button class="icon-btn ss-btn" id="lbShowBtn" aria-label="Slideshow" title="Slideshow (S)"><svg viewBox="0 0 24 24"><path class="ss-play" d="M7 5l12 7-12 7z"/><path class="ss-pause" d="M8 5v14M16 5v14"/></svg></button>
    <a class="icon-btn" id="lbDownload" aria-label="Download original" download><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
    <button class="icon-btn fs-btn" id="lbFullBtn" aria-label="Fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path class="fs-enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fs-exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
    <button class="icon-btn" id="lbInfoBtn" aria-label="Info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </div>
  <button class="lb-nav prev" id="lbPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb-nav next" id="lbNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <aside class="lb-info" id="lbInfo" hidden></aside>
</div>

<script src="static/app.js"></script>
</body>
</html>
